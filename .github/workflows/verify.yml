name: verify

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test*.py'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/research.py check examples/agent-skill-installation-reviewed
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/validate.py speak examples/agent-skill-installation-reviewed
